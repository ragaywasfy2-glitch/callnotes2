# VERSION 3 - 54 lines
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project
        run: |
          flutter create --org com.example --project-name callnotes app
          cd app
          flutter pub add sqflite path permission_handler:^11.3.1 image_picker path_provider

      - name: Copy app files
        run: cp -r files/. app/

      - name: Use fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null
          fi

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Call Notes v${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
