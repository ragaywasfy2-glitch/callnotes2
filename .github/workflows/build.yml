# VERSION 9 - 65 lines
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project
        run: |
          flutter create --org com.example --project-name callnotes app
          cd app
          flutter pub add sqflite path "permission_handler:^11.3.1" image_picker path_provider "file_picker:^8.1.3"

      - name: Raise compileSdk and targetSdk to 36
        working-directory: app
        run: |
          FILE_KTS="android/app/build.gradle.kts"
          FILE_GRADLE="android/app/build.gradle"
          
          if [ -f "$FILE_KTS" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' "$FILE_KTS"
            sed -i 's/targetSdk = .*/targetSdk = 36/g' "$FILE_KTS"
          elif [ -f "$FILE_GRADLE" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' "$FILE_GRADLE"
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' "$FILE_GRADLE"
          fi

          # تعطيل فحص الـ AAR metadata للمكتبات القديمة لمنع توقف البناء نهائياً
          PROPS_FILE="android/gradle.properties"
          echo "android.suppressUnsupportedCompileSdk=34,35,36" >> "$PROPS_FILE"
          echo "android.enforceUniquePackageName=false" >> "$PROPS_FILE"

      - name: Copy app files
        run: cp -r files/. app/

      - name: Use fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null
          fi

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Call Notes v${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
          
